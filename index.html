<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parmak İzi - Profesyonel OSINT Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { width: 100%; max-width: 700px; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1f2937; margin-bottom: 25px; }
        .logo { font-size: 20px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .search-box { width: 100%; max-width: 700px; display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input { flex: 1; padding: 14px 18px; background-color: #111827; border: 1px solid #374151; border-radius: 12px; color: #fff; font-size: 16px; outline: none; transition: border 0.2s; }
        .search-box input:focus { border-color: #38bdf8; }
        .search-box button { padding: 0 24px; background-color: #0ea5e9; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .search-box button:hover { background-color: #0284c7; }
        
        .results-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 16px; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { border-color: #38bdf8; transform: translateY(-2px); }
        .platform-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; background: #1f2937; flex-shrink: 0; }
        .card-info { flex: 1; }
        .platform-name { font-size: 14px; font-weight: 600; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .profile-name { font-size: 18px; font-weight: 700; color: #fff; margin-top: 4px; }
        .profile-handle { font-size: 14px; color: #6b7280; }
        .visit-btn { background: #1f2937; color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 500; transition: background 0.2s; border: 1px solid #374151; }
        .visit-btn:hover { background: #374151; }
        
        .loader { display: none; text-align: center; color: #9ca3af; margin: 40px 0; font-size: 16px; }
        .loader i { animation: spin 1s linear infinite; margin-right: 8px; color: #38bdf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fa-solid fa-fingerprint"></i> parmak izi</div>
    </div>

    <div class="search-box">
        <input type="text" id="usernameInput" placeholder="Kullanıcı adı girin (örn: nurr_ssw)..." />
        <button onclick="searchProfiles()">Ara</button>
    </div>

    <div id="loader" class="loader"><i class="fa-solid fa-spinner"></i> Dijital ayak izleri taranıyor...</div>
    <div id="results" class="results-container"></div>

    <script>
        // Platformların orijinal marka renkleri
        const brandColors = {
            'Instagram': '#E1306C',
            'TikTok': '#fe2752',
            'Snapchat': '#FFFC00',
            'GitHub': '#ffffff',
            'Reddit': '#FF4500',
            'Twitter / X': '#1d9bf0',
            'Pinterest': '#E60023',
            'Roblox': '#e0e0e0'
        };

        async function searchProfiles() {
            const username = document.getElementById('usernameInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            
            if (!username) return alert('Lütfen bir kullanıcı adı girin!');

            resultsDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/search?username=${encodeURIComponent(username)}`);
                const data = await response.json();
                
                loader.style.display = 'none';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div style="text-align:center; color:#6b7280; padding:20px;">Hiçbir aktif profil bulunamadı.</div>';
                    return;
                }

                data.forEach(item => {
                    const color = brandColors[item.platform] || '#38bdf8';
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="platform-icon" style="color: ${color};"><i class="${item.icon}"></i></div>
                        <div class="card-info">
                            <div class="platform-name" style="color: ${color};">${item.platform} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;"></i></div>
                            <div class="profile-name">@${username}</div>
                            <div class="profile-handle">Aktif Profil</div>
                        </div>
                        <a href="${item.url}" target="_blank" class="visit-btn">Profili Gör</a>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                loader.style.display = 'none';
                alert('Bir hata oluştu.');
            }
        }
    </script>
</body>
</html>
