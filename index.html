<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parmak İzi - Dijital Ayak İzi Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { width: 100%; max-width: 650px; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #1f2937; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        
        .search-tabs { width: 100%; max-width: 650px; display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn { background-color: #111827; border: 1px solid #1f2937; color: #9ca3af; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .tab-btn.active { background-color: #1d4ed8; border-color: #3b82f6; color: #fff; }
        
        .search-box { width: 100%; max-width: 650px; display: flex; gap: 10px; margin-bottom: 25px; }
        .search-box input { flex: 1; padding: 14px 18px; background-color: #111827; border: 1px solid #374151; border-radius: 12px; color: #fff; font-size: 16px; outline: none; transition: border 0.2s; }
        .search-box input:focus { border-color: #38bdf8; }
        .search-box button { padding: 0 24px; background-color: #1d4ed8; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .search-box button:hover { background-color: #1e40af; }
        
        .results-container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: border-color 0.2s; }
        .card:hover { border-color: #374151; }
        
        .card-top { display: flex; align-items: center; justify-content: space-between; }
        .platform-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; }
        
        .profile-main { display: flex; align-items: center; gap: 14px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .profile-info { flex: 1; }
        .profile-name { font-size: 18px; font-weight: 700; color: #fff; }
        .profile-handle { font-size: 14px; color: #9ca3af; margin-top: 2px; }
        
        .stats-row { font-size: 13px; color: #9ca3af; display: flex; gap: 15px; border-top: 1px solid #1f2937; padding-top: 10px; }
        .date-row { font-size: 13px; color: #6b7280; display: flex; flex-direction: column; gap: 4px; }
        
        .accordion-btn { background: none; border: none; color: #38bdf8; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 6px; padding-top: 5px; }
        .extra-fields { display: none; background: #0d1322; border: 1px solid #1f2937; border-radius: 10px; padding: 12px; margin-top: 5px; flex-direction: column; gap: 8px; }
        .extra-field-item { display: flex; justify-content: space-between; color: #d1d5db; font-size: 13px; }
        .extra-field-item span:first-child { color: #9ca3af; font-weight: 500; }
        
        .visit-btn { background: #1f2937; color: #fff; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 500; border: 1px solid #374151; transition: background 0.2s; }
        .visit-btn:hover { background: #374151; color: #38bdf8; }

        .loader { display: none; text-align: center; color: #9ca3af; margin: 40px 0; font-size: 16px; }
        .loader i { animation: spin 1s linear infinite; margin-right: 8px; color: #38bdf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fa-solid fa-fingerprint"></i> parmak izi</div>
    </div>

    <div class="search-tabs">
        <button class="tab-btn active" onclick="switchTab('username', this)">
            <i class="fa-solid fa-at"></i> Kullanıcı adı
        </button>
        <button class="tab-btn" onclick="switchTab('email', this)">
            <i class="fa-solid fa-envelope"></i> E-posta
        </button>
        <button class="tab-btn" onclick="switchTab('phone', this)">
            <i class="fa-solid fa-phone"></i> Telefon
        </button>
    </div>

    <div class="search-box">
        <input type="text" id="queryInput" placeholder="Kullanıcı adınızı girin..." />
        <button onclick="searchProfiles()"><i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <div id="loader" class="loader"><i class="fa-solid fa-spinner"></i> Sorgulanıyor...</div>
    <div id="results" class="results-container"></div>

    <script>
        let currentMode = 'username';

        function switchTab(mode, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
            
            const input = document.getElementById('queryInput');
            if (mode === 'username') {
                input.placeholder = "Kullanıcı adınızı girin...";
            } else if (mode === 'email') {
                input.placeholder = "E-posta adresini girin...";
            } else if (mode === 'phone') {
                input.placeholder = "Telefon numarasını girin (Örn: 5... za da +90...)";
            }
        }

        const brandStyles = {
            'Instagram': { color: '#E1306C', bg: 'linear-gradient(45deg, #f09433, #dc2743, #bc1888)' },
            'TikTok': { color: '#fe2752', bg: '#000000' },
            'Snapchat': { color: '#FFFC00', bg: '#FFFC00' },
            'GitHub': { color: '#ffffff', bg: '#24292e' },
            'Pinterest': { color: '#E60023', bg: '#E60023' },
            'Twitter / X': { color: '#1d9bf0', bg: '#000000' },
            'WhatsApp': { color: '#25D366', bg: '#25D366' },
            'Telegram': { color: '#229ED9', bg: '#229ED9' },
            'Rehber / Truecaller': { color: '#38bdf8', bg: '#1d4ed8' },
            'Gravatar / E-posta Kaydı': { color: '#38bdf8', bg: '#1d4ed8' }
        };

        async function searchProfiles() {
            const query = document.getElementById('queryInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            
            if (!query) {
                alert('Lütfen bir değer girin!');
                return;
            }

            resultsDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&type=${currentMode}`);
                const data = await response.json();
                
                loader.style.display = 'none';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div style="text-align:center; color:#6b7280; padding:20px;">Geçersiz format veya bu değerle eşleşen kayıt bulunamadı.</div>';
                    return;
                }

                data.forEach((item, index) => {
                    const style = brandStyles[item.platform] || { color: '#38bdf8', bg: '#1f2937' };
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <div class="platform-badge" style="color: ${style.color};">
                                <i class="${item.icon}"></i> ${item.platform} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;"></i>
                            </div>
                            <a href="${item.url}" target="_blank" class="visit-btn">Profili Gör</a>
                        </div>
                        
                        <div class="profile-main">
                            <div class="avatar" style="background: ${style.bg}; color: ${item.platform === 'Snapchat' ? '#000' : '#fff'};">
                                <i class="${item.icon}"></i>
                            </div>
                            <div class="profile-info">
                                <div class="profile-name">${item.displayName}</div>
                                <div class="profile-handle">Sorgulanan: ${query}</div>
                            </div>
                        </div>

                        <div class="stats-row">
                            <span><i class="fa-solid fa-chart-bar"></i> ${item.stats}</span>
                        </div>

                        <div class="date-row">
                            <div>Durum: ${item.lastActive}</div>
                        </div>

                        <div>
                            <button class="accordion-btn" onclick="toggleExtra(${index})">
                                <i class="fa-solid fa-play" id="icon-${index}" style="font-size: 10px; transition: transform 0.2s;"></i> + Detayları Gör
                            </button>
                            <div class="extra-fields" id="extra-${index}">
                                <div class="extra-field-item"><span>E-posta:</span> <b style="color: #9ca3af;">${item.email}</b></div>
                                <div class="extra-field-item"><span>Telefon Numarası:</span> <b style="color: #9ca3af;">${item.phone}</b></div>
                                <div class="extra-field-item"><span>Güvenlik Skoru:</span> <span style="color: #10b981;">Yüksek (%94)</span></div>
                            </div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                loader.style.display = 'none';
                alert('Sorgulama sırasında bir hata oluştu.');
            }
        }

        function toggleExtra(index) {
            const extraDiv = document.getElementById(`extra-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (extraDiv.style.display === 'flex') {
                extraDiv.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                extraDiv.style.display = 'flex';
                icon.style.transform = 'rotate(90deg)';
            }
        }
    </script>
</body>
</html>
