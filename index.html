<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT // Clean Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #0b0f19;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 20px;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-tabs {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background-color: #111827;
            border: 1px solid #1f2937;
            color: #9ca3af;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { border-color: #374151; color: #fff; }
        .tab-btn.active { background-color: #1f2937; border-color: #4b5563; color: #fff; font-weight: 600; }

        .search-box {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus { border-color: #4b5563; }

        .search-box button {
            padding: 0 20px;
            background-color: #374151;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 16px;
        }

        .search-box button:hover { background-color: #4b5563; }

        .results-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .platform-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            color: #9ca3af;
        }

        .profile-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profile-name { font-size: 16px; font-weight: 600; color: #fff; }
        .profile-handle { font-size: 13px; color: #9ca3af; font-family: 'JetBrains Mono', monospace; }
        .profile-bio { font-size: 13px; color: #d1d5db; margin-top: 4px; }

        .stats-row {
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            gap: 12px;
            border-top: 1px solid #1f2937;
            padding-top: 10px;
        }

        .accordion-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .accordion-btn:hover { color: #fff; }

        .extra-fields {
            display: none;
            background-color: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            margin-top: 6px;
            flex-direction: column;
            gap: 8px;
        }

        .extra-field-item { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
        .extra-field-item .label { color: #9ca3af; }
        .extra-field-item .val { color: #fff; }
        .extra-field-item .info { color: #6b7280; font-size: 11px; }

        .visit-btn {
            background-color: #1f2937;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid #374151;
            transition: background-color 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }

        .visit-btn:hover { background-color: #374151; }

        .loader {
            display: none;
            text-align: center;
            color: #9ca3af;
            margin: 30px 0;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .loader i { animation: spin 1s linear infinite; margin-right: 6px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fa-solid fa-shield-halved"></i> osint // records</div>
    </div>

    <div class="search-tabs">
        <button class="tab-btn active" onclick="switchTab('username', this)">
            <i class="fa-solid fa-at"></i> Kullanıcı Adı
        </button>
        <button class="tab-btn" onclick="switchTab('email', this)">
            <i class="fa-solid fa-envelope"></i> E-Posta
        </button>
        <button class="tab-btn" onclick="switchTab('phone', this)">
            <i class="fa-solid fa-phone"></i> Telefon
        </button>
    </div>

    <div class="search-box">
        <input type="text" id="queryInput" placeholder="Kullanıcı adı girin (@sız)..." />
        <button onclick="searchProfiles()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div id="loader" class="loader"><i class="fa-solid fa-circle-notch"></i> Kayıtlar taranıyor...</div>
    <div id="results" class="results-container"></div>

    <script>
        let currentMode = 'username';

        function switchTab(mode, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
            
            const input = document.getElementById('queryInput');
            input.value = '';
            document.getElementById('results').innerHTML = '';

            if (mode === 'username') {
                input.placeholder = "Kullanıcı adı girin (@sız)...";
            } else if (mode === 'email') {
                input.placeholder = "E-posta adresi girin...";
            } else if (mode === 'phone') {
                input.placeholder = "Telefon numarası (+905XXXXXXXXX)...";
            }
        }

        async function searchProfiles() {
            const query = document.getElementById('queryInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            
            if (!query) {
                alert('Lütfen aranacak değeri girin!');
                return;
            }

            resultsDiv.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&type=${currentMode}`);
                const data = await response.json();
                
                loader.style.display = 'none';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<div style="text-align:center; color:#6b7280; padding:20px; font-family: JetBrains Mono;">Kayıt bulunamadı.</div>';
                    return;
                }

                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-top">
                            <div class="platform-badge">
                                <i class="${item.icon}"></i> ${item.platform}
                            </div>
                            <a href="${item.url}" target="_blank" class="visit-btn">Aç <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:9px;"></i></a>
                        </div>
                        
                        <div class="profile-main">
                            <div class="profile-name">${item.displayName}</div>
                            <div class="profile-handle">@${query}</div>
                            <div class="profile-bio">${item.bio}</div>
                        </div>

                        <div class="stats-row">
                            <span><i class="fa-solid fa-chart-bar" style="color:#6b7280;"></i> ${item.stats}</span>
                        </div>

                        <div>
                            <button class="accordion-btn" onclick="toggleExtra(${index})">
                                <i class="fa-solid fa-chevron-right" id="icon-${index}" style="font-size: 10px; transition: transform 0.2s;"></i> + ek alanlar
                            </button>
                            <div class="extra-fields" id="extra-${index}">
                                <div class="extra-field-item">
                                    <span class="label">Kullanıcı kimliği:</span> 
                                    <span class="val">${item.userId}</span>
                                    <span class="info">${item.userIdInfo}</span>
                                </div>
                                <div class="extra-field-item" style="margin-top: 4px;">
                                    <span class="label">E-posta:</span> <span class="val">${item.email}</span>
                                </div>
                                <div class="extra-field-item">
                                    <span class="label">Telefon:</span> <span class="val">${item.phone}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                loader.style.display = 'none';
                alert('Bağlantı hatası oluştu.');
            }
        }

        function toggleExtra(index) {
            const extraDiv = document.getElementById(`extra-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (extraDiv.style.display === 'flex') {
                extraDiv.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                extraDiv.style.display = 'flex';
                icon.style.transform = 'rotate(90deg)';
            }
        }
    </script>
</body>
</html>
