<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parmak İzi - Gerçek OSINT Taraması</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --border-color: #1f2937;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--border-color);
            color: var(--text-color);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--accent-color);
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }
        button.submit-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .result-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .status-not { color: #ef4444; }
        a { color: var(--accent-color); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fa-solid fa-fingerprint"></i> parmak izi</h2>
        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('user', this)">Kullanıcı Adı (Sherlock)</button>
            <button class="tab-btn" onclick="setTab('email', this)">E-Posta (Holehe)</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Sorgulanacak kullanıcı adını girin...">
            <button class="submit-btn" onclick="performSearch()"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div id="resultBox"></div>
    </div>

    <script>
        let currentTab = 'user';

        function setTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('searchInput').placeholder = tab === 'user' ? 'Kullanıcı adı girin...' : 'E-posta adresi girin...';
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const box = document.getElementById('resultBox');
            if (!query) return;

            if (currentTab === 'user') {
                box.innerHTML = `<div class="result-card"><i class="fa-solid fa-spinner fa-spin"></i> Sherlock gerçek platformları tarıyor...</div>`;
                try {
                    const res = await fetch(`/api/search?username=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);

                    let html = `<h4>🔍 Sherlock Kullanıcı Raporu (${data.username}):</h4>`;
                    data.results.forEach(p => {
                        html += `
                            <div class="result-card" style="display:flex; justify-content:space-between; align-items:center;">
                                <span><strong>${p.platform}</strong></span>
                                <div>
                                    <span style="margin-right: 15px; font-weight: bold; color: ${p.exists ? '#10b981' : '#ef4444'};">
                                        ${p.exists ? '● Bulundu (Aktif)' : '○ Bulunamadı'}
                                    </span>
                                    <a href="${p.url}" target="_blank">Git <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                                </div>
                            </div>
                        `;
                    });
                    box.innerHTML = html;
                } catch (err) {
                    box.innerHTML = `<div class="result-card status-not">Hata: Tarama gerçekleştirilemedi.</div>`;
                }
            } else if (currentTab === 'email') {
                box.innerHTML = `<div class="result-card"><i class="fa-solid fa-spinner fa-spin"></i> Holehe e-posta platformlarını sorguluyor...</div>`;
                try {
                    const res = await fetch(`/api/email?mail=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);

                    let html = `<h4>✉️ Holehe E-Posta Raporu (${data.mail}):</h4>`;
                    data.results.forEach(p => {
                        html += `
                            <div class="result-card" style="display:flex; justify-content:space-between; align-items:center;">
                                <span><strong>${p.platform}</strong></span>
                                <span style="font-weight: bold; color: ${p.exists ? '#10b981' : '#ef4444'};">
                                    ${p.exists ? '● Kayıtlı (Hesap Var)' : '○ Kayıt Bulunamadı'}
                                </span>
                            </div>
                        `;
                    });
                    box.innerHTML = html;
                } catch (err) {
                    box.innerHTML = `<div class="result-card status-not">Hata: Holehe taraması gerçekleştirilemedi.</div>`;
                }
            }
        }
    </script>
</body>
</html>
